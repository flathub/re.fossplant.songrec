app-id: re.fossplant.songrec
runtime: org.gnome.Platform
runtime-version: "51"
sdk: org.gnome.Sdk
command: songrec
sdk-extensions:
  - org.freedesktop.Sdk.Extension.rust-stable
  - org.freedesktop.Sdk.Extension.llvm22
finish-args:
  - --share=network
  - --share=ipc
  - --socket=fallback-x11
  - --socket=wayland
  - --device=all
  - --talk-name=org.kde.StatusNotifierWatcher
  - --socket=pulseaudio
  - --filesystem=xdg-run/pipewire-0
build-options:
  append-path: /usr/lib/sdk/rust-stable/bin:/usr/lib/sdk/llvm22/bin
  prepend-ld-library-path: /usr/lib/sdk/llvm22/lib
  env:
    CARGO_HOME: /run/build/songrec/.cargo
modules:
  - name: songrec
    buildsystem: meson
    config-opts:
      - -Dpipewire=disabled
    sources:
      - type: archive
        url: https://github.com/marin-m/SongRec/releases/download/0.8.3/songrec_tarball_0.8.3_for_flathub_build.tar.gz
        sha256: eb1b9a957a77daa10e3b2a74cfa59b46ff92c7eb513142bc442203f0aac9e45d
        x-checker-data:
          type: json
          url: https://api.github.com/repos/marin-m/SongRec/releases/latest
          version-query: .tag_name
          url-query: .assets[] | select(.name=="songrec_tarball_" + $version + "_for_flathub_build.tar.gz")
            | .browser_download_url
